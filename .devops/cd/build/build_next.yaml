---

version: 1

sourceControl:
  repos:
    - 3rd-parties
    - embedded-specs
    - habana-transformer-engine
    - hcl
    - huda
    - media
    - neural-compressor-fork
    - neural-compressor-fork-cicd
    - pytorch-integration
    - pytorch-fork # only for the purpose of comparing version.txt to avoid unnecessary builds
    - pytorch-next
    - pytorch-training-tests
    - specs_external
    - swtools_sdk
    - synapse
    - synapse_profiler
    - synapse_utils
    - kineto
    - tpc_kernels

steps:
  preBuild:
    - name: compare version.txt between pytorch-fork and pytorch-next
      cmd: cd ${BUILD_DIR} && make compare-pt-versions RELEASE_VERSION=${RELEASE_VERSION} RELEASE_BUILD_ID=${RELEASE_BUILD_ID} SRC_DIR=${SOURCE_DIR} WORK_DIR=${WORKSPACE} BUILD_OS=${BUILD_OS}
    - name: prepare pytorch repo
      cmd: rm -rf ${SOURCE_DIR}/pytorch-fork && cp -R ${SOURCE_DIR}/pytorch-next ${SOURCE_DIR}/pytorch-fork
    - name: install build dependencies
      cmd: cd ${BUILD_DIR} && make init-sw-deps RELEASE_VERSION=${RELEASE_VERSION} RELEASE_BUILD_ID=${RELEASE_BUILD_ID} SRC_DIR=${SOURCE_DIR} WORK_DIR=${WORKSPACE} BUILD_OS=${BUILD_OS}
    - name: init Python
      cmd: cd ${BUILD_DIR} && make init-python RELEASE_VERSION=${RELEASE_VERSION} RELEASE_BUILD_ID=${RELEASE_BUILD_ID} SRC_DIR=${SOURCE_DIR} WORK_DIR=${WORKSPACE} BUILD_OS=${BUILD_OS}
  build:
    - name: pytorch Fork
      cmd: cd ${BUILD_DIR} && make build-fork RELEASE_VERSION=${RELEASE_VERSION} RELEASE_BUILD_ID=${RELEASE_BUILD_ID} SRC_DIR=${SOURCE_DIR} WORK_DIR=${WORKSPACE} BUILD_OS=${BUILD_OS}
    - name: install pytorch fork
      cmd: cd ${BUILD_DIR} && make install-fork RELEASE_VERSION=${RELEASE_VERSION} RELEASE_BUILD_ID=${RELEASE_BUILD_ID} SRC_DIR=${SOURCE_DIR} WORK_DIR=${WORKSPACE} BUILD_OS=${BUILD_OS}
    - name: vision_next
      cmd: cd ${BUILD_DIR} && make build-vision_next RELEASE_VERSION=${RELEASE_VERSION} RELEASE_BUILD_ID=${RELEASE_BUILD_ID} SRC_DIR=${SOURCE_DIR} WORK_DIR=${WORKSPACE} BUILD_OS=${BUILD_OS}
    - name: modules
      cmd: cd ${BUILD_DIR} && make build-modules_next RELEASE_VERSION=${RELEASE_VERSION} RELEASE_BUILD_ID=${RELEASE_BUILD_ID} SRC_DIR=${SOURCE_DIR} WORK_DIR=${WORKSPACE} BUILD_OS=${BUILD_OS}
    - name: plugin
      cmd: cd ${BUILD_DIR} && make build-plugin RELEASE_VERSION=${RELEASE_VERSION} RELEASE_BUILD_ID=${RELEASE_BUILD_ID} SRC_DIR=${SOURCE_DIR} WORK_DIR=${WORKSPACE} BUILD_OS=${BUILD_OS}
    - name: GPU Migration
      cmd: cd ${BUILD_DIR} && make build-gpu_migration RELEASE_VERSION=${RELEASE_VERSION} RELEASE_BUILD_ID=${RELEASE_BUILD_ID} SRC_DIR=${SOURCE_DIR} WORK_DIR=${WORKSPACE} BUILD_OS=${BUILD_OS}
    - name: audio_next
      cmd: cd ${BUILD_DIR} && make build-audio_next RELEASE_VERSION=${RELEASE_VERSION} RELEASE_BUILD_ID=${RELEASE_BUILD_ID} SRC_DIR=${SOURCE_DIR} WORK_DIR=${WORKSPACE} BUILD_OS=${BUILD_OS}
    - name: data_next
      cmd: cd ${BUILD_DIR} && make build-data_next RELEASE_VERSION=${RELEASE_VERSION} RELEASE_BUILD_ID=${RELEASE_BUILD_ID} SRC_DIR=${SOURCE_DIR} WORK_DIR=${WORKSPACE} BUILD_OS=${BUILD_OS}
    - name: text_next
      cmd: cd ${BUILD_DIR} && make build-text_next RELEASE_VERSION=${RELEASE_VERSION} RELEASE_BUILD_ID=${RELEASE_BUILD_ID} SRC_DIR=${SOURCE_DIR} WORK_DIR=${WORKSPACE} BUILD_OS=${BUILD_OS}
    - name: inc
      cmd: cd ${BUILD_DIR} && make build-inc RELEASE_VERSION=${RELEASE_VERSION} RELEASE_BUILD_ID=${RELEASE_BUILD_ID} SRC_DIR=${SOURCE_DIR} WORK_DIR=${WORKSPACE} BUILD_OS=${BUILD_OS}
    - name: hte
      cmd: cd ${BUILD_DIR} && make build-hte RELEASE_VERSION=${RELEASE_VERSION} RELEASE_BUILD_ID=${RELEASE_BUILD_ID} SRC_DIR=${SOURCE_DIR} WORK_DIR=${WORKSPACE} BUILD_OS=${BUILD_OS}
  postBuild:
    - name: archive PT
      cmd: cd ${BUILD_DIR} && make archive-next RELEASE_VERSION=${RELEASE_VERSION} RELEASE_BUILD_ID=${RELEASE_BUILD_ID} SRC_DIR=${SOURCE_DIR} WORK_DIR=${WORKSPACE} BUILD_OS=${BUILD_OS}
