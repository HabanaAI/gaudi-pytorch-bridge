---

version: 1

sourceControl:
  repos:
    - pytorch-integration
    - devops/cd_release
    - automation
    - habanaqa
    - synapse
    - habanalabs
    - synapse_profiler
    - coral-sim
    - hl-thunk
    - func-sim5
    - model_garden
    - pytorch-fork
    - pytorch-training-tests
    - event_tests_plugin
    - deepspeed-fork
    - tensorguard
    - optimum-habana-fork
    - fairseq-fork

environment:
  SPECIFIC_REPO_BRANCH_LIST: model_garden:g3_po
  DRAM_ALLOCATION: 64
  RUN_SIM_IN_DOCKER: true

steps:
  gaudi3:
    preTest:
      - name: start
        cmd: ./cd_release/tests/simulator/hl-start.sh coral_sim9
        env:
          HL_SIM_PARAMS: '"-f --gear 5 -config enable_json=1"'
    tests:
      - name: resnext101_1x_perf
        cmd: ./cd_release/tests/simulator/PT-Suite/run-test-in-container.sh resnext101_1x_perf
      - name: bertft_1x_perf
        cmd: ./cd_release/tests/simulator/PT-Suite/run-test-in-container.sh bertft_1x_perf
      - name: bertft_eager_1x_perf
        cmd: ./cd_release/tests/simulator/PT-Suite/run-test-in-container.sh bertft_eager_1x_perf
      - name: bertpt_layer16_ph1_1x_perf
        cmd: ./cd_release/tests/simulator/PT-Suite/run-test-in-container.sh bertpt_layer16_ph1_1x_perf
      - name: bertpt_layer16_ph2_1x_perf
        cmd: ./cd_release/tests/simulator/PT-Suite/run-test-in-container.sh bertpt_layer16_ph2_1x_perf
      - name: resnet_lars_media_perf
        cmd: ./cd_release/tests/simulator/PT-Suite/run-test-in-container.sh singlenode_resnet_lars_media_perf_sim_gaudi3
      - name: prophetnet_perf
        cmd: ./cd_release/tests/simulator/PT-Suite/run-test-in-container.sh singlenode_prophetnet_perf_sim_gaudi3
      - name: unet3d_1x_perf
        cmd: ./cd_release/tests/simulator/PT-Suite/run-test-in-container.sh unet3d_1x_perf
    postTest:
      - name: kill
        cmd: ./cd_release/tests/simulator/hl-kill.sh coral_sim9