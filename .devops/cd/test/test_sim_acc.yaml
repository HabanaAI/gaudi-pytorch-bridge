---

version: 1

sourceControl:
  repos:
    - pytorch-integration
    - devops/cd_release
    - automation
    - habanaqa
    - synapse
    - habanalabs
    - synapse_profiler
    - coral-sim
    - hl-thunk
    - func-sim5
    - model_garden
    - pytorch-fork
    - pytorch-training-tests
    - event_tests_plugin
    - deepspeed-fork
    - tensorguard
    - optimum-habana-fork
    - fairseq-fork

environment:
  SPECIFIC_REPO_BRANCH_LIST: model_garden:g3_po
  DRAM_ALLOCATION: 64
  RUN_SIM_IN_DOCKER: true

steps:
  gaudi2:
    preTest:
      - name: start
        cmd: ./cd_release/tests/simulator/hl-start.sh coral_sim6
    tests:
      - name: resnet_lars_media_tensorguard_record
        cmd: ./cd_release/tests/simulator/PT-Suite/run-test-in-container.sh singlenode_resnet_lars_media_tg_sim_record
      - name: prophetnet_tensorguard_record
        cmd: ./cd_release/tests/simulator/PT-Suite/run-test-in-container.sh singlenode_prophetnet_tg_sim_record
      - name: resnext_media_tg_sim_record
        cmd: ./cd_release/tests/simulator/PT-Suite/run-test-in-container.sh singlenode_resnext_media_tg_sim_record
      - name: bert_pt_ph1_tg_sim_record
        cmd: ./cd_release/tests/simulator/PT-Suite/run-test-in-container.sh singlenode_bertpt_ph1_tg_sim_record
      - name: bert_pt_ph2_tg_sim_record
        cmd: ./cd_release/tests/simulator/PT-Suite/run-test-in-container.sh singlenode_bertpt_ph2_tg_sim_record
      - name: bertft_eager_tensorguard_record
        cmd: ./cd_release/tests/simulator/PT-Suite/run-test-in-container.sh singlenode_bertft_eager_tg_sim_record
    postTest:
      - name: kill
        cmd: ./cd_release/tests/simulator/hl-kill.sh coral_sim6
  gaudi3:
    preTest:
      - name: start
        cmd: ./cd_release/tests/simulator/hl-start.sh coral_sim9
    tests:
      - name: resnet_lars_media_tensorguard_sim_replay_and_compare
        cmd: ./cd_release/tests/simulator/PT-Suite/run-test-in-container.sh singlenode_resnet_lars_media_tg_sim_replay_and_compare
      - name: prophetnet_tensorguard_sim_replay_and_compare
        cmd: ./cd_release/tests/simulator/PT-Suite/run-test-in-container.sh singlenode_prophetnet_tg_sim_replay_and_compare
      - name: resnext_media_tg_sim_replay_and_compare
        cmd: ./cd_release/tests/simulator/PT-Suite/run-test-in-container.sh singlenode_resnext_media_tg_sim_replay_and_compare
      - name: bert_pt_ph1_tg_sim_replay_and_compare
        cmd: ./cd_release/tests/simulator/PT-Suite/run-test-in-container.sh singlenode_bertpt_ph1_tg_sim_replay_and_compare
      - name: bert_pt_ph2_tg_sim_replay_and_compare
        cmd: ./cd_release/tests/simulator/PT-Suite/run-test-in-container.sh singlenode_bertpt_ph2_tg_sim_replay_and_compare
      - name: bertft_eager_tensorguard_sim_replay_and_compare
        cmd: ./cd_release/tests/simulator/PT-Suite/run-test-in-container.sh singlenode_bertft_eager_tg_sim_replay_and_compare
    postTest:
      - name: kill
        cmd: ./cd_release/tests/simulator/hl-kill.sh coral_sim9