---

version: 1

sourceControl:
  repos:
    - pytorch-integration
    - devops/cd_release
    - automation
    - habanalabs
    - habanaqa
    - model_garden
    - pytorch-training-tests
    - pytorch-fork
    - event_tests_plugin
    - deepspeed-fork
    - huda
    - optimum-habana-fork
    - fairseq-fork

archiveArtifacts:
  - "*.txt"
  - "*.xml"

steps:
  gaudi:
    tests:
      - name: pytorch_qa
        cmd: ./cd_release/tests/asic/PT-Suite/pt-test-qa.sh
      - name: pytorch_topology
        cmd: ./cd_release/tests/asic/PT-Suite/pt-test-topology.sh
      - name: pytorch_sanity_conda
        cmd: ./cd_release/tests/asic/PT-Suite/pt-test-sanity.sh conda
      - name: gpu_migration_unit_tests
        cmd: ./cd_release/tests/asic/PT-Suite/gpu_migration-unit_tests.sh
  gaudi2:
    tests:
      - name: pytorch_g2_topology
        cmd: ./cd_release/tests/asic/PT-Suite/pt-gaudi2-topology-tests.sh
      - name: gpu_migration_g2_unit_tests
        cmd: ./cd_release/tests/asic/PT-Suite/gpu_migration-unit_tests.sh
  hls1:
    tests:
      - name: pytorch_qa
        cmd: ./cd_release/tests/asic/PT-Suite/pt-test-hls.sh