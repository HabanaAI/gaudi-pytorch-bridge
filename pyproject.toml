[tool.ruff]
line-length = 120
target-version = "py312"

# Rules: https://docs.astral.sh/ruff/rules
[tool.ruff.lint]
select = ["F","E","W","I","UP","B","C4","EXE","PYI","SIM","ARG","FIX","PL","N","PIE","S"]
ignore = [
   "E501", # "Line too long" (88 chars)
   "PLE1205", # "We use custom logger"
   "E722",
   "E741",
   "F811",
   "F841",
   "B006",
   "B008",
   "B023",
   "B028",
   "B904",
   "PLE0605",
   "PLE0704",
   "PLR0124",
   "PLR0911",
   "PLR0912",
   "PLR0913",
   "PLR0915",
   "PLR1714",
   "PLR1722",
   "PLR2004",
   "PLW0602",
   "PLW0603",
   "PLW0604",
   "PLW1508",
   "PLW2901",
   "PYI024",
   "PYI026",
   "PYI034",
   "PYI036",
   "SIM103",
   "SIM105",
   "SIM108",
   "SIM115",
   "SIM118",
   "ARG001",
   "ARG002",
   "ARG003",
   "ARG004",
   "ARG005",
   "FIX001",
   "FIX002",
   "FIX004",
   "N801",
   "N802",
   "N803",
   "N804",
   "N805",
   "N806",
   "N812",
   "N816",
   "N818",
   "N999",
   "S101",
   "S105",
   "S110",
   "S307",
   "S602",
   "S603",
   "S605",
   "S607",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401",
    "E402",
    "F403",
    "F405",
]
"*_C.py" = [
    "F401",
    "F403",
]
"*tests/*" = [
    "S108",
    "S311",
]
".devops/*" = [
    "S108",
]
