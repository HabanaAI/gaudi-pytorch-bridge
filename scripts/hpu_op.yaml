# Manual
# Fields descriptions:
#  - guid - the name of kernel/cguid executing operation.
#  - out_ids - indices of input tensors, based on which outputs are allocated.
#              Not applicable for inplace/out ops. Overriden by output_meta.
#  - inplace_ids - indices of inplace input tensors.
#  - scalar_ids - these input Scalars will be converted to Tensors.
#  - op_backend - custom OpBackend class overriding AddNode. Overrides most other fields.
#  - op_frontend - custom frontend class overriding LazyOp/EagerOp, e.g. for op signature change.
#  - schema_args - overriden signature of the op. Used with op_frontend.
#  - dtypes - dtypes supported by the operator. Not needed if op_validator used.
#  - output_meta - function for output tensors metadata calculation.
#  - st_meta - attribute to add an op to the optimized output sif flow for dynamic cache hit scenarios
#  - custom_fill_params - function filling params structure for kernel/cguid. Not needed if op_backend used.
#  - frontend_blocklist - restricts frontend generation to eager or lazy mode. For custom ops with autograd support, autograd can also be specified.
#  - promote_to_common_type - names of inputs to execute type promotion on.
#  - promote_int_to_float - names of inputs casted automatically to float.
#  - promote_int_to_long - names of inputs casted automatically to long.
#  - synapse_layouts - inputs/outputs layouts for non-layout-agnostic ops.
#  - custom_op_schema - signature of a custom op. Used for custom ops only.
#  - op_validator:
#      if not given, op support validated based on dtypes field,
#      if set to check-node-with-shared-layer, automatic validation by shared layer will be executed,
#             applicable only for ops mapped directly to one kernel/cguid, without op_backend and op_frontend,
#      other value points to the function which performs manual validation, e.g. for multiple kernels.
#  - op_validator_exception - reason why op_validator is not used. Required when op_validator is not set.
#  - only_shared_layer - mark ops registered and implemented manually in the backend just for shared layer validation.
#  - override_fn - function for full override of the op frontend and backend.
#  - lazy - separate flow for lazy mode.
#  - skip_slrg - skip automatic documentation generation by shared layer report generator (has an effect only in non-custom ops), example: torch.nn.functional
#  - only_slrg - generate validator only for shared layer report generator purposes
#  - namespaces - a list of namespaces in which the specified op occurs (for slrg purposes)
#  - pytorch_module_names - module names (list) associated with the op, required when "torch.nn" appears in the "namespaces" field
#  - overwritten_op_names_in_slrg - op names (list) displayed in the report for all namespaces except torch.nn:
#      e.g. _adaptive_avg_pool2d should be displayed as adaptive_avg_pool2d and adaptive_avg_pool1d
#  - autograd - used to register backward support for operator
#  - treat_as_dtdf - used to generate op in eager mode even if it is not dfdt.
#  - handle_output_mask - used to return 0-D tensors at positions in output_mask where bits are set to 0 (for backward operators that get output_mask bool array).
#  - custom_cpp_sig - allows specifying a custom C++ signature for the operator; use only if the automatically generated signature is incorrect
#      e.g. for torch_scatter.ind2ptr, the C++ signature in torch_scatter uses at::Tensor instead of const at::Tensor&, so the operator cannot be called with const at::Tensor&.
#  - treat_as_non_inplace - marks a parameter as non-inplace when the C++ signature requires a non-const tensor argument.
#  - op_templates - list of templates to use for the operator. Templates available templates are located in hpu_op_templates.yaml.

