parse:
  additional_commands:
    add_habana_library:
      flags:
        - STATIC
        - SHARED
        - OBJECT
        - MODULE
        - INTERFACE
        - IMPORTED
        - GLOBAL
        - UNKNOWN
    add_habana_executable:
      flags:
        - IMPORTED
        - GLOBAL
format:
  line_width: 120
  tab_size: 2
markup:
  enable_markup: false
  # copyright headers
  first_comment_is_literal: True
