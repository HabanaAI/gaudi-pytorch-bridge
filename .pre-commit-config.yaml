repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.3.0
    hooks:
      - id: check-added-large-files
      - id: check-executables-have-shebangs
        exclude: ^topologies/
    # TODO: fix issues and enable when time allows: https://jira.habana-labs.com/browse/SW-121821
    # - id: end-of-file-fixer
    #   exclude: ^(LICENSE.txt|topologies/)
    # - id: trailing-whitespace
    #   exclude: ^(LICENSE|topologies/)
  # TODO: fix issues and enable when time allows: https://jira.habana-labs.com/browse/SW-121813
  # - repo: https://github.com/cheshirekow/cmake-format-precommit
  #   rev: v0.6.13
  #   hooks:
  #       - id: cmake-format
  #         additional_dependencies: ["pyyaml"]
  #       - id: cmake-lint
  #         additional_dependencies: ["pyyaml"]
  - repo: https://github.com/aostrowski/pre-commit-mirror-git-clang-format
    rev: v10.0.1
    hooks:
      - id: git-clang-format
  - repo: local
    hooks:
      - id: check-bash-syntax
        name: Check shell scripts syntax
        entry: bash -n
        language: system
        files: \.(ba)?sh$
      - id: ensure-new-cpp-files-are-added-to-cmake
        name: Ensure new C++ files are added to CMake
        entry: scripts/ensure_new_cpp_files_are_added_to_cmake.sh
        language: script
        types: [c++]
        # TODO: https://jira.habana-labs.com/browse/SW-120634: remove files from this ticket from `exclude:` below once they're fixed
        # exclude files handled by setup.py's and PT_VER-specific
        exclude: ^python_packages/habana_frameworks/torch/|^pytorch_helpers/dataloader/habana_dataloader/|^pt_ver/|^tests/test_(autodiff|utils|base).cpp$|^pytorch_helpers/habana_helpers/tensor_comparator/synapse/src/infra/(float16|sim_fp16).cpp$|^habana_bridge/register/compiler.cpp$|^hpu_ops/op_validator.cpp$
  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 3.0.0
    hooks:
      - id: forbid-binary
        exclude: ^topologies/
      # - id: git-check  # hopefully to be added once we fix whitespace issues
      - id: script-must-have-extension
        exclude: ^topologies/
  - repo: https://github.com/psf/black
    rev: 24.2.0
    hooks:
      - id: black
        exclude: ^topologies/
