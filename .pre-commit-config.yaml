---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: ^(LICENSE.txt|.devops|scripts/tests/files/)
  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: v0.6.13
    hooks:
      - id: cmake-format
        additional_dependencies: ["pyyaml"]
  #       - id: cmake-lint
  #         additional_dependencies: ["pyyaml"]
  - repo: https://github.com/aostrowski/pre-commit-mirror-git-clang-format
    rev: v10.0.1
    hooks:
      - id: git-clang-format
        exclude: ^(scripts/tests/files/|.devops/patches/)
  - repo: local
    hooks:
      - id: check-bash-syntax
        name: Check shell scripts syntax
        entry: bash -n
        language: system
        files: \.(ba)?sh$
      - id: ensure-new-cpp-files-are-added-to-cmake
        name: Ensure new C++ files are added to CMake
        entry: scripts/ensure_new_cpp_files_are_added_to_cmake.sh
        language: script
        types: [c++]
        # TODO: https://jira.habana-labs.com/browse/SW-120634: remove files
        # from this ticket from `exclude:` below once they're fixed
        exclude: "^python_packages/habana_frameworks/torch/|\
          ^tests/user_custom_op/|\
          ^pytorch_helpers/habana_helpers/tensor_comparator/synapse/src/infra/(float16|sim_fp16).cpp$|\
          ^scripts/tests/files/"
  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 3.0.0
    hooks:
      - id: forbid-binary
      - id: script-must-have-extension
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args: ["--ignore=E203,E501,W503,W504,\
          E722,E741,F811,F821,F841,B001,B006,\
          B008,B011,B023,B028,C417,EXE001"] # https://jira.habana-labs.com/browse/SW-121808
        additional_dependencies:
          - flake8-bugbear==24.12.12
          - flake8-comprehensions==3.16.0
          - flake8-executable==2.1.3
          - flake8-pyi==24.9.0
          - mccabe==0.7.0
        exclude: (__init__.py|.*_C.py)
  - repo: https://github.com/PyCQA/isort
    rev: 6.0.0
    hooks:
      - id: isort
  # TODO: fix issues and enable when time allows:
  # https://jira.habana-labs.com/browse/SW-121807
  # - repo: https://github.com/PyCQA/pylint
  #   rev: v3.3.4
  #   hooks:
  #       - id: pylint
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.5
    hooks:
      - id: insert-license
        name: Handle copyright headers in scripts
        files: \.(ba|z)?sh$|CMakeLists.txt$|\.cmake$|(?<!__init__)\.py$
        args:
          - --allow-past-years
          - --use-current-year
          # yamllint disable rule:line-length
          - --comment-style
          - |-
            ###############################################################################|#|###############################################################################
          # yamllint enable rule:line-length
  # TODO: fix issues and enable when time allows:
  # https://jira.habana-labs.com/browse/SW-121816
  #       - id: insert-license
  #         name: Handle copyright headers in C++ files
  #         files: \.c(pp)?$|\.h(pp)?$
  #         args:
  # yamllint disable rule:line-length
  #             - --comment-style
  #             - |-
  #               /*******************************************************************************| *| *******************************************************************************
  #                */
  # yamllint enable rule:line-length
  #             - --fuzzy-match-generates-todo
  #             - --use-current-year
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.29.0
    hooks:
      - id: yamllint
        files: \.ya?ml$
        # TODO: fix issues and stop excluding .ci when time allows:
        # https://jira.habana-labs.com/browse/SW-121821
        exclude: ^.ci/
