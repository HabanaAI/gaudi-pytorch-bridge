# yaml-language-server: $schema=https://artifactory-kfs.habana-labs.com:443/artifactory/devops-generic-dev-local/json-ci-yaml-schemas/component_config.json
config:
  jobTimeout: '180'
  sharedCCacheEnabled: true
  gerritTriggerMap:
    - repository: pytorch-fork
    - repository: pytorch-vision-fork
    - repository: pytorch-integration
    - repository: lightning-habana-fork
  osBuild:
    ubuntu18.04: "off"
  dependantComponents:
    - component: deepspeed_fork
    - component: pt_next
