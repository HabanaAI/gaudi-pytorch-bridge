common:
  testRepos:
    - repository: automation
    - repository: pytorch-integration
    - repository: coral-sim
    - repository: tpcsim
    - repository: habanalabs
    - repository: nic_kmd
    - repository: complex_guid_lib
  dependencies:
    - COMPLEX_GUID
    - CORAL_SIM
    - HCL
    - HL_THUNK
    - SWTOOLS_SDK
    - SYNAPSE
    - SYNAPSE_UTILS
    - TPC_FUSER
    - TPC_KERNELS
    - TPCSIM
    - RDMA_CORE
  config:
    testCommand: run_pytorch_modules_tests
    loadLKD: true
    testXMLOutputKey: --xml
    releaseFlag: false
    saveToFileBeatMount: true
  envVars:
    LD_LIBRARY_PATH: "${LD_LIBRARY_PATH}:${HOME}/.venv/lib/${__python_cmd}/site-packages/torch/lib:$(${__python_cmd} -c 'import habana_frameworks.torch.lib; print(habana_frameworks.torch.lib.__path__[0]);'):${RDMA_CORE_ROOT}/build/lib"
    CI_WORKSPACE_TO_TOX: "${WORKSPACE}"
    LD_PRELOAD: "/lib/x86_64-linux-gnu/libtcmalloc.so.4"
    JOB_SCENARIO: pt_ci_cpp
  preTestStages:
    Install Python test dependencies:
      command: '__check_pytorch_dev_py_deps; __check_pytest_dev_py_deps'
    Update PyTorch module:
        command: |
          pt_next_dir=$(ls dependencies | grep Build_pt_next -m 1)
          if [ ! -z $pt_next_dir ]
          then
            rm -f $PYTORCH_FORK_RELEASE_BUILD/pkgs/torch-*.whl
            rm -f $PYTORCH_MODULES_RELEASE_BUILD/pkgs/*.whl
            cp -f ./dependencies/$pt_next_dir/pt_next_deps/whl_pyfork/*torch*.whl ${PYTORCH_FORK_RELEASE_BUILD}/pkgs/
            cp -f ./dependencies/$pt_next_dir/pt_next_deps/whl_pyint/*.whl ${PYTORCH_MODULES_RELEASE_BUILD}/pkgs/
            cp -f ./dependencies/$pt_next_dir/pt_next_deps/test_pt_integration ${PYTORCH_MODULES_RELEASE_BUILD}/
            cp -f ./dependencies/$pt_next_dir/pt_next_deps/test_pt2_integration ${PYTORCH_MODULES_RELEASE_BUILD}/
          fi
          __clean_pytorch_dev_py_deps
          pip install -U $PYTORCH_FORK_RELEASE_BUILD/pkgs/*.whl
          pip install -U ${PYTORCH_VISION_FORK_BUILD}/pkgs/*.whl
          install_pillow_simd
          if [ $GERRIT_PROJECT == lightning-habana-fork ]
          then
            pip install -U $LIGHTNING_HABANA_FORK_BUILD/pkgs/*.whl
          fi
          pip install -U $PYTORCH_MODULES_RELEASE_BUILD/pkgs/*.whl

testsMap:
  Test_pytorch_modules_gaudi_sim_cpp_suite_future:
    dependencies:
      - PT_NEXT
    stages:
      Run CPP tests gaudi sim:
        filter: -t cpp_tests
  Test_pytorch_modules_gaudi2_sim_cpp_suite_future:
    dependencies:
      - TPC_LLVM
      - PT_NEXT
    stages:
      Run CPP tests gaudi2 sim:
        filter: -t cpp_tests --dut gaudi2
  Test_pytorch_modules_gaudi3_sim_cpp_suite_future:
    dependencies:
      - TPC_LLVM
      - PT_NEXT
    stages:
      Run CPP tests gaudi3 sim:
        filter: -t cpp_tests --dut gaudi3
