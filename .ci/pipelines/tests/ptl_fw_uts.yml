common:
  config:
    testCommand: run_pytorch_lightning_qa_tests
    loadLKD: true
    testXMLOutputKey: --xml
    releaseFlag: false
  envVars:
    LD_LIBRARY_PATH: "${LD_LIBRARY_PATH}:${HOME}/.venv/lib/${__python_cmd}/site-packages/torch/lib:$(${__python_cmd} -c 'import habana_frameworks.torch.lib; print(habana_frameworks.torch.lib.__path__[0]);')"
    CI_WORKSPACE_TO_TOX: "${WORKSPACE}"
    LD_PRELOAD: "/lib/x86_64-linux-gnu/libtcmalloc.so.4"
  preTestStages:
    Install Python test dependencies:
      command: '__check_pytorch_dev_py_deps; __check_pytest_dev_py_deps;'
    Update PyTorch module:
        command: |
          __clean_pytorch_dev_py_deps
          pip install -U $PYTORCH_FORK_RELEASE_BUILD/pkgs/*.whl
          pip install -U ${PYTORCH_VISION_FORK_BUILD}/pkgs/*.whl
          install_pillow_simd
          pip install -U $PYTORCH_MODULES_RELEASE_BUILD/pkgs/*.whl
          pip install -U $PYTORCH_LIGHTNING_FORK_BUILD/pkgs/*.whl
          pip install -U $HABANA_LIGHTNING_PLUGINS_BUILD/pkgs/*.whl
testsMap:
  Test_pytorch_modules_gaudi2_asic_ptl_fw_uts:
    stages:
      Run lightning framework unit tests:
        filter: -t all
  Test_pytorch_modules_gaudi_asic_ptl_fw_uts:
    stages:
      Run lightning framework unit tests:
        filter: -t all