common:
  testRepos:
    - repository: automation
    - repository: pytorch-integration
    - repository: habanalabs
    - repository: nic_kmd
    - repository: habanaqa
    - repository: pytorch-training-tests
    - repository: event_tests_plugin
    - repository: model_garden
  dependencies:
    - CODEC
    - COMPLEX_GUID
    - HCL
    - HL_THUNK
    - MEDIA
    - PT_NEXT
    - RDMA_CORE
    - SWTOOLS_SDK
    - SYNAPSE
    - SYNAPSE_UTILS
    - TPC_KERNELS
  config:
    testCommand: run_pytorch_qa_tests
    loadLKD: true
    testXMLOutputKey: --xml
    releaseFlag: false
    saveToFileBeatMount: true
  envVars:
    LD_LIBRARY_PATH: "${LD_LIBRARY_PATH}:${RDMA_CORE_ROOT}/build/lib:${HOME}/.venv/lib/${__python_cmd}/site-packages/torch/lib:$(${__python_cmd} -c 'import habana_frameworks.torch.lib; print(habana_frameworks.torch.lib.__path__[0]);'):${RDMA_CORE_ROOT}/build/lib"
    CI_WORKSPACE_TO_TOX: "${WORKSPACE}"
    LD_PRELOAD: "/lib/x86_64-linux-gnu/libtcmalloc.so.4"
    JOB_SCENARIO: pt_smoke_gaudi2
  preTestStages:
    Install Python test dependencies:
      command: '__check_pytorch_dev_py_deps; __check_pytest_dev_py_deps'
    Update PyTorch module:
        command: '__clean_pytorch_dev_py_deps; pip install -U $PYTORCH_FORK_RELEASE_BUILD/pkgs/*.whl; pip install -U ${PYTORCH_VISION_FORK_BUILD}/pkgs/*.whl; install_pillow_simd; if [ $GERRIT_PROJECT == lightning-habana-fork ]; then pip install -U $LIGHTNING_HABANA_FORK_BUILD/pkgs/*.whl --force-reinstall --no-deps; fi; pip install -U $PYTORCH_MODULES_RELEASE_BUILD/pkgs/*.whl'
    Install media loader wheel:
      command: 'pip install -U ${MEDIA_RELEASE_BUILD}/pkgs/*.whl'
testsMap:
  Test_pytorch_modules_gaudi2_asic_topology_group_1_future:
    dependencies:
      - TPC_FUSER
      - TPC_LLVM
    stages:
      Run RN50 Eager bf16 1c training functional:
        filter: -t rn50_eager_1c
      Run RN50 Graph bf16 1c training functional:
        filter: -t rn50_graph_1c
