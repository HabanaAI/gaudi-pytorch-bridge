# yaml-language-server: $schema=https://artifactory-kfs.habana-labs.com:443/artifactory/devops-generic-dev-local/json-ci-yaml-schemas/test_definition.json
common:
  testRepos:
    - repository: automation
      githubOrg: habana-internal
    - repository: pytorch-integration
      githubOrg: habana-internal
    - repository: swtools_sdk
      githubOrg: habana-internal
    - repository: specs_external
      githubOrg: habana-internal
    - repository: embedded-specs
      githubOrg: habana-internal
  dependencies:
    - COMPLEX_GUID
    - HCL
    - HL_THUNK
    - HLML
    - MEDIA
    - PT_FORK
    - SWTOOLS_SDK
    - SYNAPSE
    - SYNAPSE_PROFILER
    - SYNAPSE_UTILS
    - TPC_KERNELS
  config:
    testCommand: ""
    loadLKD: false
    releaseFlag: false
  envVars:
    CC: clang-20
    CXX: clang++-20
    CTCACHE_DIR: /build_cache/.ctcache
    # when env_flags.yaml is edited, tidy repeatedly takes forever.
    # As it's low risk, let's just disable the generated files from hash calculation
    CTCACHE_EXCLUDE_HASH_REGEX: ".*generated/env_flags.*"
    CTCACHE_SAVE_OUTPUT: 1
  preTestStages:
    Install PyTorch:
      command: |
        set -xe
        pip install -U ${PYTORCH_FORK_RELEASE_BUILD}/pkgs/*torch*.whl
    configure ctcache:
      runOutsideDocker: true
      command: mkdir -p ${DOCKER_BUILD_CACHE_VOLUME}.ctcache
testsMap:
  Test_pytorch_modules_cpu_tidy:
    stages:
      Analyze sources with clang-tidy:
        # -k0 continues the build after the first error
        filter: |
          set -x
          cd ${PYTORCH_MODULES_ROOT_PATH}
          build_pytorch_modules -c -l --tidy --build-tool-flag=-k0
