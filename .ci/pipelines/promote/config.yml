orchestratorConfig:
  cron: "H H/3 * * *"
  testConfig:
  - testToLaunch: pytorch_modules/Tests/Test_pytorch_modules_gaudi_sim_cpp_suite
    runInSanitizer: true
    runInCodeCoverage: true
# Test_pytorch_modules_gaudi2_asic_cpp_suite to be replaced by Test_pytorch_modules_gaudi2_sim_cpp_suite
  - testToLaunch: pytorch_modules/Tests/Test_pytorch_modules_gaudi2_asic_cpp_suite
  - testToLaunch: pytorch_modules/Tests/Test_pytorch_modules_greco_sim_cpp_suite
# PyTorch full graph tests
  - testToLaunch: pytorch_modules/Tests/Test_pytorch_modules_gaudi_hls_asic_perf
  - testToLaunch: pytorch_modules/Tests/Test_pytorch_modules_gaudi2_asic_perf
  - testToLaunch: pytorch_modules/Tests/Test_pytorch_modules_gaudi_asic_sbs
  - testToLaunch: pytorch_modules/Tests/Test_pytorch_modules_gaudi2_asic_sbs
  - testToLaunch: pytorch_modules/Tests/Test_pytorch_modules_gaudi_asic_topology
  - testToLaunch: pytorch_modules/Tests/Test_pytorch_modules_gaudi2_asic_topology
  - testToLaunch: pytorch_training_tests/Tests/Test_pytorch_training_tests_gaudi_sim_distributed
  - testToLaunch: pytorch_training_tests/Tests/Test_pytorch_training_tests_gaudi2_sim_distributed
  - testToLaunch: pytorch_training_tests/Tests/Test_pytorch_training_tests_gaudi3_sim_distributed
    silentMode: true
# Reason: https://jira.habana-labs.com/browse/SW-127443
  - testToLaunch: fairseq_fork/Tests/Test_fairseq_fork_gaudi_asic_pytorch_fairseq_topology
    silentMode: true
  - testToLaunch: fairseq_fork/Tests/Test_fairseq_fork_gaudi2_asic_pytorch_fairseq_topology
# PyTorch Operators and feature validation <Start>
  - testToLaunch: pytorch_training_tests/Tests/Test_pytorch_training_tests_gaudi_asic_promote_training_suite
  - testToLaunch: pytorch_training_tests/Tests/Test_pytorch_training_tests_gaudi2_asic_promote_training_suite
  - testToLaunch: pytorch_training_tests/Tests/Test_pytorch_training_tests_gaudi3_sim_promote_training_suite
# Dtype validation <Start>
  - testToLaunch:  pytorch_training_tests/Tests/Test_pytorch_training_tests_gaudi3_sim_promote_training_suite_dtype
# Dtype validation <End>
# Subgraph validation <Start>
  - testToLaunch: pytorch_training_tests/Tests/Test_pytorch_training_tests_gaudi2_asic_promote_training_suite_sub_graph_other
# Subgraph validation <End>
# PyTorch Operators and feature validation <End>
# deepspeed-fork <Start>
  - testToLaunch:  deepspeed_fork/Tests/Test_deepspeed_fork_gaudi2_sim_test
  - testToLaunch:  deepspeed_fork/Tests/Test_deepspeed_fork_gaudi_sim_test
  - testToLaunch:  deepspeed_fork/Tests/Test_deepspeed_fork_gaudi2_asic_unit_tests_promote
# deepspeed-fork <End>
  sanitizerConfig:
    - testToLaunch: pytorch_modules/Tests/Test_pytorch_modules_gaudi_sim_cpp_suite
    - testToLaunch: pytorch_training_tests/Tests/Test_pytorch_training_tests_greco_sim_promote_training_suite
  codeCoverageConfig:
    - testToLaunch: pytorch_modules/Tests/Test_pytorch_modules_gaudi_sim_cpp_suite
    - testToLaunch: pytorch_training_tests/Tests/Test_pytorch_training_tests_greco_sim_promote_training_suite
  coverityConfig:
    - testToLaunch: pytorch_modules/Scans/Coverity_Build_pytorch_modules
stepConfig:
  jobTimeout: '300'
